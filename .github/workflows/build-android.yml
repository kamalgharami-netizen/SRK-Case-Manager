name: SRK Case Manager - Android APK + Windows EXE

on:
  push:
    branches: [main, feature/google-drive-two-way-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srk-case-manager-build-${{ github.ref }}
  # Do not cancel an in-progress Windows/Android build when a newer commit arrives.
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Preinstall Android emulator system image with retry
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          IMAGE="system-images;android-35;default;x86_64"
          installed=0
          for attempt in 1 2 3; do
            echo "Installing Android emulator image (attempt $attempt/3)"
            if "$SDKMANAGER" --install "$IMAGE" --channel=0; then
              if [ -s "${ANDROID_HOME}/system-images/android-35/default/x86_64/source.properties" ]; then
                installed=1
                break
              fi
            fi
            echo "SDK image archive was incomplete; clearing SDK download cache before retry."
            rm -rf "${ANDROID_HOME}/.temp" "${HOME}/.android/cache" || true
            sleep 5
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::Android API 35 default system image could not be installed after three attempts."
            exit 1
          fi

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check TypeScript
        run: npm run lint

      - name: Test sync journal safety
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Add and synchronise Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Set Android minimum supported SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/variables.gradle")
          if not path.exists():
              raise SystemExit("Capacitor variables.gradle was not generated; refusing to build with an unknown Android minimum SDK.")
          content = path.read_text()
          match = re.search(r"(minSdkVersion\s*=\s*)(\d+)", content)
          if not match:
              raise SystemExit("Could not find minSdkVersion in android/variables.gradle.")
          current = int(match.group(2))
          if current < 24:
              content = content[:match.start(2)] + "24" + content[match.end(2):]
              path.write_text(content)
          print(f"Android minimum SDK: {max(current, 24)} (Android 7.0 or later)")
          PY

      - name: Compile native sync-store instrumentation tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :srk-capacitor-sync-state:assembleDebugAndroidTest --no-daemon

      - name: Run native sync-store instrumentation tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-load -wipe-data -memory 2048 -cores 2 -no-metrics
          # Use the Android 15 default image without Google Play services: the previous Google APIs image repeatedly crashed Android system services and system_server on the non-KVM GitHub Linux runner. Keep guest RAM bounded to reduce host memory pressure.
          # Avoid the action's adb input keyevent command; emulator system services intermittently die immediately after boot.
          disable-animations: false
          working-directory: android
          # This action invokes each physical script line in a separate /usr/bin/sh process.
          # Keep the complete loop and test/diagnostic sequence on one shell line.
          script: |
            echo "===== Wait for fully booted Android emulator ====="; ready=0; for attempt in $(seq 1 120); do booted="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"; api="$(adb -s emulator-5554 shell getprop ro.build.version.sdk 2>/dev/null | tr -d "\r" || true)"; if [ "$booted" = "1" ] && [ "$api" -ge 24 ] 2>/dev/null && adb -s emulator-5554 shell pm path android >/dev/null 2>&1; then ready=1; break; fi; sleep 5; done; if [ "$ready" -ne 1 ]; then echo "Android emulator did not complete boot or report a valid API level."; adb devices -l || true; adb -s emulator-5554 shell getprop ro.build.version.sdk || true; adb -s emulator-5554 logcat -b all -d -v time | tail -n 300 || true; exit 1; fi; echo "Android emulator is ready (API $api)."; echo "===== Confirm emulator shell remains responsive ====="; for probe in 1 2 3; do adb -s emulator-5554 shell getprop ro.build.version.sdk >/dev/null || { echo "Emulator shell health check failed ($probe/3)."; exit 1; }; sleep 2; done; echo "===== Verify Android emulator package manager readiness ====="; adb -s emulator-5554 shell pm list packages >/dev/null; ./gradlew :srk-capacitor-sync-state:connectedDebugAndroidTest --no-daemon --stacktrace; test_status=$?; echo "===== Connected Android devices ====="; adb devices -l || true; echo "===== Emulator crash diagnostics ====="; adb -s emulator-5554 logcat -b all -d -v time | grep -E "FATAL EXCEPTION|AndroidRuntime|am_crash|am_anr|INSTRUMENTATION|Process .* died|Fatal signal|keystore|SyncStateDatabase|TestRunner" | tail -n 400 || true; exit "$test_status"

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Case-Manager-Android-Instrumentation-Reports
          path: |
            capacitor-sync-state/android/build/reports/androidTests/connected/debug
            capacitor-sync-state/android/build/outputs/androidTest-results/connected/debug
          if-no-files-found: warn
          retention-days: 7

      - name: Set Android version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE=$((52000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName .*/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Configure persistent release signing
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/srk-release.keystore"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle")
          content = path.read_text()
          if "signingConfigs" not in content:
              content = content.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/srk-release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """,
                  1
              )
          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          if re.search(pattern, content):
              content = re.sub(pattern, r"\1\n            signingConfig signingConfigs.release", content, count=1)
          else:
              raise SystemExit("Could not locate Android release build type; refusing to create an unsigned release APK.")
          path.write_text(content)
          PY

      - name: Build signed release APK
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify release APK signature and report certificate fingerprints
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android SDK Build Tools apksigner was not found."
            find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          echo "## Android release signing certificate" >> "$GITHUB_STEP_SUMMARY"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/srk-apk-certificate.txt"
          SHA1="$(sed -n 's/^V[0-9][0-9]* Signer: certificate SHA-1 digest: //p' "$RUNNER_TEMP/srk-apk-certificate.txt" | head -n 1)"
          SHA256="$(sed -n 's/^V[0-9][0-9]* Signer: certificate SHA-256 digest: //p' "$RUNNER_TEMP/srk-apk-certificate.txt" | head -n 1)"
          test -n "$SHA1"
          test -n "$SHA256"
          {
            echo ""
            echo "| Fingerprint | Value |"
            echo "|---|---|"
            echo "| SHA-1 | ${SHA1} |"
            echo "| SHA-256 | ${SHA256} |"
            echo ""
            echo "These are public certificate fingerprints, not private signing-key material."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK (temporary fallback until signing secrets are configured)
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        working-directory: android
        run: |
          echo "::warning::A persistent Android signing key is not configured. This debug APK is not guaranteed to update an APK from a previous GitHub Actions run."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload signed Android APK
        if: ${{ env.HAS_ANDROID_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Case-Manager-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload temporary debug APK
        if: ${{ env.HAS_ANDROID_SIGNING != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Case-Manager-Android-APK-DEBUG-ONLY
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Case-Manager-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-report:
    name: Build status report
    if: always()
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish automatic build message
        env:
          ANDROID_RESULT: ${{ needs.build-android.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
        run: |
          {
            echo "## SRK Case Manager build report"
            echo ""
            echo "| Platform | Result |"
            echo "|---|---|"
            echo "| Android APK | ${ANDROID_RESULT} |"
            echo "| Windows EXE | ${WINDOWS_RESULT} |"
            echo ""
            if [ "${ANDROID_RESULT}" = "success" ] && [ "${WINDOWS_RESULT}" = "success" ]; then
              echo "Both installers were built successfully. Download them from this workflow run's Artifacts section."
            else
              echo "At least one platform build did not succeed. Open the failed job above and inspect its logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
