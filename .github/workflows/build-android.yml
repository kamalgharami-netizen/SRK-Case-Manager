
      - name: Install Capacitor dependencies
        run: npm install --legacy-peer-deps @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Build web application
        run: npm run build

      - name: Configure Capacitor
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.srk.casemanage",
            "appName": "SRK Case Manager",
            "webDir": "dist"
          }
          EOF
          fi

      - name: Add and Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
