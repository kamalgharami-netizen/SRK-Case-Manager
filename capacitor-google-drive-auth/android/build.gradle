apply plugin: 'com.android.library'

android {
    namespace 'in.srk.capacitor.googledriveauth'
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
}

dependencies {
    implementation project(':capacitor-android')
    // 22.0.0 includes the current AuthorizationRequest Picker resource parameters.
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
