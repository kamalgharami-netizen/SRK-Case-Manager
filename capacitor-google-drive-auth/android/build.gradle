apply plugin: 'com.android.library'

android {
    namespace 'in.srk.capacitor.googledriveauth'
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
}

dependencies {
    implementation project(':capacitor-android')
    // 21.6.0 includes the Drive Picker folder-selection parameter while avoiding the API 24 minimum introduced by newer transitive Google Play services.
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
}
